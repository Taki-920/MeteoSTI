<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title> MétéoMonde </title>
    </head>
    <body>
        <header> 
            <h1> MétéoMonde - Weather </h1>
        </header>
        
        <div class="card">
            <label> Entrer une ville (ex : Paris)</label><br/>
            <input id="LocationInput" placeholder="ville"/>
            <button id="boutonGet"> Obtenir la météo</button>
            <button id="boutonGeo">Utiliser ma position</button>
            <div id="statusSite"><small>Prêt.</small></div>
        </div>
        
            <div id="resultat" style="display:none">
            <div class="card">
            <strong id="localisation">-</strong>
            <div id="date heure"><small>date / heure</small> </div>
        </div> 

        <div class="grid">
            <div class="card">
            <h3>Température</h3>
            <div id="Température">- °C</div>
            <small id="ressenti"> </small>
        </div>

        <div class="card">
            <h3> Précipitation</h3>
            <div id="precip">-  mm/h</div>
            <small id="pricip-prob"></small>  
        </div>

        <div class="card">
            <h3> Etat du ciel</h3>
            <div id="condition">-</div>
            <small id="weathercode-help"></small>
        </div>
        
        <div class="card">
            <h3>Vent</h3>
            <div id="vent">— m/s</div>
            <small id="rafale"></small>
        </div>

    <script src="Météo.js"></script>
    </body>
</html>
